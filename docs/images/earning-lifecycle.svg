<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480">
  <defs>
    <style>
      .status-box { stroke-width: 2; rx: 8; }
      .box-pending { fill: #fff3e0; stroke: #f57c00; }
      .box-confirmed { fill: #e3f2fd; stroke: #1976d2; }
      .box-payable { fill: #e8f5e9; stroke: #388e3c; }
      .box-paid { fill: #c8e6c9; stroke: #2e7d32; }
      .box-reversed { fill: #ffebee; stroke: #c62828; }
      .box-payout { fill: #f3e5f5; stroke: #7b1fa2; }
      .arrow { stroke: #495057; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-red { stroke: #c62828; stroke-width: 2; fill: none; marker-end: url(#arrowhead-red); }
      .label { font-family: system-ui, sans-serif; font-size: 11px; fill: #212529; font-weight: 600; }
      .detail { font-family: system-ui, sans-serif; font-size: 9.5px; fill: #616161; }
      .trigger { font-family: system-ui, sans-serif; font-size: 9px; fill: #757575; font-style: italic; }
      .title { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: #212529; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" class="title">Earning Lifecycle</text>

  <!-- Step 1: Sale made -->
  <rect x="140" y="40" width="220" height="40" rx="20" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="250" y="64" text-anchor="middle" class="label">Shopper makes a purchase</text>

  <line x1="250" y1="80" x2="250" y2="105" class="arrow"/>

  <!-- Status: Pending -->
  <rect x="140" y="110" width="220" height="50" class="status-box box-pending"/>
  <text x="250" y="135" text-anchor="middle" class="label">Pending</text>
  <text x="250" y="150" text-anchor="middle" class="detail">Awaiting retailer validation</text>

  <!-- Trigger label -->
  <text x="310" y="183" text-anchor="start" class="trigger">Retailer confirms sale</text>
  <line x1="250" y1="160" x2="250" y2="200" class="arrow"/>

  <!-- Branch to Reversed (from Pending) -->
  <line x1="360" y1="135" x2="430" y2="135" class="arrow-red"/>
  <line x1="430" y1="135" x2="430" y2="335" class="arrow-red" style="marker-end: none;"/>
  <text x="440" y="155" class="trigger" fill="#c62828">Retailer declines</text>

  <!-- Status: Confirmed -->
  <rect x="140" y="205" width="220" height="50" class="status-box box-confirmed"/>
  <text x="250" y="230" text-anchor="middle" class="label">Confirmed</text>
  <text x="250" y="245" text-anchor="middle" class="detail">Awaiting AWIN payment to LYKE</text>

  <!-- Trigger label -->
  <text x="310" y="278" text-anchor="start" class="trigger">AWIN pays LYKE (monthly)</text>
  <line x1="250" y1="255" x2="250" y2="295" class="arrow"/>

  <!-- Status: Payable -->
  <rect x="140" y="300" width="220" height="50" class="status-box box-payable"/>
  <text x="250" y="325" text-anchor="middle" class="label">Payable</text>
  <text x="250" y="340" text-anchor="middle" class="detail">Creator can request payout</text>

  <!-- Branch to Reversed (from Confirmed/Payable) -->
  <line x1="360" y1="325" x2="430" y2="325" style="stroke: #c62828; stroke-width: 1.5; stroke-dasharray: 4,3;"/>
  <line x1="430" y1="325" x2="430" y2="345" class="arrow-red" style="marker-end: none;"/>
  <text x="385" y="318" class="trigger" fill="#c62828" font-size="8">Late reversal</text>

  <!-- Status: Reversed -->
  <rect x="390" y="350" width="200" height="50" class="status-box box-reversed"/>
  <text x="490" y="375" text-anchor="middle" class="label" fill="#c62828">Reversed</text>
  <text x="490" y="390" text-anchor="middle" class="detail">Sale returned or fraudulent</text>

  <!-- Trigger label -->
  <text x="310" y="373" text-anchor="start" class="trigger">Creator requests payout</text>
  <line x1="250" y1="350" x2="250" y2="390" class="arrow"/>

  <!-- Status: Payout Processing -->
  <rect x="140" y="395" width="220" height="50" class="status-box box-payout"/>
  <text x="250" y="420" text-anchor="middle" class="label">Payout Requested</text>
  <text x="250" y="435" text-anchor="middle" class="detail">Approved and sent to creator's bank</text>

  <line x1="250" y1="445" x2="250" y2="455" class="arrow"/>

  <!-- Status: Paid -->
  <rect x="165" y="458" width="170" height="18" rx="9" fill="#2e7d32"/>
  <text x="250" y="471" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#ffffff" font-weight="600">Paid</text>
</svg>
