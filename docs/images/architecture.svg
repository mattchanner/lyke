<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <style>
      .box { fill: #f8f9fa; stroke: #495057; stroke-width: 2; rx: 8; }
      .box-header { fill: #e9ecef; stroke: #495057; stroke-width: 2; }
      .endpoint-box { fill: #fff; stroke: #6c757d; stroke-width: 1; rx: 4; }
      .db-box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; rx: 8; }
      .text-title { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #212529; }
      .text-label { font-family: system-ui, sans-serif; font-size: 11px; fill: #495057; }
      .text-small { font-family: system-ui, sans-serif; font-size: 10px; fill: #6c757d; }
      .arrow { stroke: #495057; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057"/>
    </marker>
  </defs>

  <!-- Mobile App -->
  <rect x="50" y="20" width="500" height="50" class="box"/>
  <text x="300" y="50" text-anchor="middle" class="text-title">Mobile App (Ionic/Angular)</text>

  <!-- Arrow -->
  <line x1="300" y1="70" x2="300" y2="100" class="arrow"/>

  <!-- API Layer -->
  <rect x="50" y="110" width="500" height="180" class="box"/>
  <text x="300" y="135" text-anchor="middle" class="text-title">ASP.NET Core API</text>

  <!-- Endpoint boxes - Row 1 -->
  <rect x="70" y="150" width="140" height="45" class="endpoint-box"/>
  <text x="140" y="177" text-anchor="middle" class="text-label">Auth Endpoints</text>

  <rect x="230" y="150" width="140" height="45" class="endpoint-box"/>
  <text x="300" y="177" text-anchor="middle" class="text-label">Feed Endpoints</text>

  <rect x="390" y="150" width="140" height="45" class="endpoint-box"/>
  <text x="460" y="177" text-anchor="middle" class="text-label">Commerce Endpoints</text>

  <!-- Endpoint boxes - Row 2 -->
  <rect x="70" y="210" width="140" height="45" class="endpoint-box"/>
  <text x="140" y="237" text-anchor="middle" class="text-label">Creator Endpoints</text>

  <rect x="230" y="210" width="140" height="45" class="endpoint-box"/>
  <text x="300" y="237" text-anchor="middle" class="text-label">Retailer Endpoints</text>

  <rect x="390" y="210" width="140" height="45" class="endpoint-box"/>
  <text x="460" y="237" text-anchor="middle" class="text-label">Admin Endpoints</text>

  <!-- Arrow -->
  <line x1="300" y1="290" x2="300" y2="320" class="arrow"/>

  <!-- Database -->
  <rect x="50" y="330" width="500" height="50" class="db-box"/>
  <text x="300" y="352" text-anchor="middle" class="text-title">PostgreSQL</text>
  <text x="300" y="368" text-anchor="middle" class="text-small">Users | Creators | Posts | Products | Retailers | Analytics</text>
</svg>
