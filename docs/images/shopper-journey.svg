<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420">
  <defs>
    <style>
      .step-box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; rx: 8; }
      .branch-box { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; rx: 8; }
      .text-step { font-family: system-ui, sans-serif; font-size: 12px; fill: #212529; }
      .text-num { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #1976d2; }
      .arrow { stroke: #495057; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-branch { stroke: #f57c00; stroke-width: 2; fill: none; marker-end: url(#arrowhead-orange); }
      .title { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #212529; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f57c00"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="250" y="25" text-anchor="middle" class="title">Shopper Journey</text>

  <!-- Step 1: Register/Login -->
  <rect x="150" y="45" width="200" height="35" class="step-box"/>
  <text x="170" y="67" class="text-num">1.</text>
  <text x="190" y="67" class="text-step">Register / Login</text>

  <line x1="250" y1="80" x2="250" y2="100" class="arrow"/>

  <!-- Step 2: Create Body Profile -->
  <rect x="150" y="105" width="200" height="35" class="step-box"/>
  <text x="170" y="127" class="text-num">2.</text>
  <text x="190" y="127" class="text-step">Create Body Profile</text>

  <!-- Branch paths -->
  <line x1="250" y1="140" x2="250" y2="155" class="arrow"/>
  <line x1="250" y1="155" x2="150" y2="155" stroke="#495057" stroke-width="2"/>
  <line x1="250" y1="155" x2="350" y2="155" stroke="#f57c00" stroke-width="2"/>
  <line x1="150" y1="155" x2="150" y2="170" class="arrow"/>
  <line x1="350" y1="155" x2="350" y2="170" class="arrow-branch"/>

  <!-- Step 3a: Personalized Feed -->
  <rect x="50" y="175" width="200" height="35" class="step-box"/>
  <text x="70" y="197" class="text-num">3a.</text>
  <text x="95" y="197" class="text-step">Browse Personalized Feed</text>

  <!-- Step 3b: Explore Feed -->
  <rect x="270" y="175" width="180" height="35" class="branch-box"/>
  <text x="290" y="197" class="text-num">3b.</text>
  <text x="315" y="197" class="text-step">Browse Explore Feed</text>

  <!-- Merge paths -->
  <line x1="150" y1="210" x2="150" y2="225" stroke="#495057" stroke-width="2"/>
  <line x1="360" y1="210" x2="360" y2="225" stroke="#495057" stroke-width="2"/>
  <line x1="150" y1="225" x2="360" y2="225" stroke="#495057" stroke-width="2"/>
  <line x1="250" y1="225" x2="250" y2="240" class="arrow"/>

  <!-- Step 4: View Post Details -->
  <rect x="125" y="245" width="250" height="35" class="step-box"/>
  <text x="145" y="267" class="text-num">4.</text>
  <text x="165" y="267" class="text-step">View Post Details (fit notes, sizing)</text>

  <line x1="250" y1="280" x2="250" y2="300" class="arrow"/>

  <!-- Step 5: Engage -->
  <rect x="125" y="305" width="250" height="35" class="step-box"/>
  <text x="145" y="327" class="text-num">5.</text>
  <text x="165" y="327" class="text-step">Engage (Like / Save / Share)</text>

  <line x1="250" y1="340" x2="250" y2="360" class="arrow"/>

  <!-- Step 6: Click Product -->
  <rect x="100" y="365" width="300" height="35" class="step-box"/>
  <text x="120" y="387" class="text-num">6.</text>
  <text x="140" y="387" class="text-step">Click Product Link → Retailer Site</text>
</svg>
