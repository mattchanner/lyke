<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 480">
  <defs>
    <style>
      .status-pending { fill: #fff9c4; stroke: #fbc02d; stroke-width: 2; rx: 8; }
      .status-published { fill: #c8e6c9; stroke: #388e3c; stroke-width: 2; rx: 8; }
      .status-rejected { fill: #ffcdd2; stroke: #d32f2f; stroke-width: 2; rx: 8; }
      .status-flagged { fill: #f8bbd9; stroke: #c2185b; stroke-width: 2; rx: 8; }
      .status-removed { fill: #d7ccc8; stroke: #5d4037; stroke-width: 2; rx: 8; }
      .action-box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; rx: 8; }
      .text-status { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 500; fill: #212529; }
      .text-action { font-family: system-ui, sans-serif; font-size: 11px; fill: #495057; }
      .text-note { font-family: system-ui, sans-serif; font-size: 10px; fill: #666; font-style: italic; }
      .arrow { stroke: #495057; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-green { stroke: #388e3c; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
      .arrow-red { stroke: #d32f2f; stroke-width: 2; fill: none; marker-end: url(#arrowhead-red); }
      .arrow-dashed { stroke: #9e9e9e; stroke-width: 2; stroke-dasharray: 5,3; fill: none; marker-end: url(#arrowhead-gray); }
      .title { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #212529; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#388e3c"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d32f2f"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9e9e9e"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="225" y="20" text-anchor="middle" class="title">Post Moderation Flow</text>

  <!-- Creator submits -->
  <rect x="125" y="35" width="200" height="30" class="action-box"/>
  <text x="225" y="55" text-anchor="middle" class="text-action">Creator submits post</text>

  <line x1="225" y1="65" x2="225" y2="85" class="arrow"/>

  <!-- PendingReview -->
  <rect x="150" y="90" width="150" height="35" class="status-pending"/>
  <text x="225" y="112" text-anchor="middle" class="text-status">PendingReview</text>

  <line x1="225" y1="125" x2="225" y2="145" class="arrow"/>

  <!-- Admin reviews -->
  <rect x="125" y="150" width="200" height="30" class="action-box"/>
  <text x="225" y="170" text-anchor="middle" class="text-action">Admin reviews content</text>

  <!-- Branch -->
  <line x1="225" y1="180" x2="225" y2="195" stroke="#495057" stroke-width="2"/>
  <line x1="120" y1="195" x2="330" y2="195" stroke="#495057" stroke-width="2"/>
  <line x1="120" y1="195" x2="120" y2="215" class="arrow-green"/>
  <line x1="330" y1="195" x2="330" y2="215" class="arrow-red"/>

  <!-- Published -->
  <rect x="55" y="220" width="130" height="35" class="status-published"/>
  <text x="120" y="242" text-anchor="middle" class="text-status">Published</text>

  <!-- Rejected -->
  <rect x="265" y="220" width="130" height="35" class="status-rejected"/>
  <text x="330" y="242" text-anchor="middle" class="text-status">Rejected</text>

  <!-- Rejected note -->
  <text x="330" y="270" text-anchor="middle" class="text-note">Creator can edit</text>
  <text x="330" y="282" text-anchor="middle" class="text-note">&amp; resubmit</text>

  <!-- User reports -->
  <line x1="120" y1="255" x2="120" y2="295" class="arrow"/>
  <text x="130" y="280" class="text-note">User reports</text>

  <!-- Flagged -->
  <rect x="55" y="300" width="130" height="35" class="status-flagged"/>
  <text x="120" y="322" text-anchor="middle" class="text-status">Flagged</text>

  <line x1="120" y1="335" x2="120" y2="355" class="arrow"/>

  <!-- Admin reviews flagged -->
  <rect x="45" y="360" width="150" height="30" class="action-box"/>
  <text x="120" y="380" text-anchor="middle" class="text-action">Admin reviews</text>

  <!-- Final branch -->
  <line x1="120" y1="390" x2="120" y2="405" stroke="#495057" stroke-width="2"/>
  <line x1="60" y1="405" x2="180" y2="405" stroke="#495057" stroke-width="2"/>
  <line x1="60" y1="405" x2="60" y2="425" class="arrow-green"/>
  <line x1="180" y1="405" x2="180" y2="425" class="arrow-red"/>

  <!-- Restored -->
  <rect x="10" y="430" width="100" height="35" class="status-published"/>
  <text x="60" y="452" text-anchor="middle" class="text-status">Restored</text>

  <!-- Removed -->
  <rect x="130" y="430" width="100" height="35" class="status-removed"/>
  <text x="180" y="452" text-anchor="middle" class="text-status">Removed</text>
</svg>
