<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420">
  <defs>
    <style>
      .step-box { fill: #ede7f6; stroke: #5e35b1; stroke-width: 2; rx: 8; }
      .branch-box { fill: #e8eaf6; stroke: #3f51b5; stroke-width: 2; rx: 8; }
      .result-box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; rx: 8; }
      .text-step { font-family: system-ui, sans-serif; font-size: 12px; fill: #212529; }
      .text-num { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #5e35b1; }
      .arrow { stroke: #495057; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .title { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #212529; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="260" y="25" text-anchor="middle" class="title">Retailer Journey</text>

  <!-- Step 1: Register -->
  <rect x="160" y="45" width="200" height="35" class="step-box"/>
  <text x="180" y="67" class="text-num">1.</text>
  <text x="200" y="67" class="text-step">Register as Retailer</text>

  <line x1="260" y1="80" x2="260" y2="100" class="arrow"/>

  <!-- Step 2: Complete Profile -->
  <rect x="130" y="105" width="260" height="35" class="step-box"/>
  <text x="150" y="127" class="text-num">2.</text>
  <text x="170" y="127" class="text-step">Complete Business Profile</text>

  <line x1="260" y1="140" x2="260" y2="160" class="arrow"/>

  <!-- Step 3: Import Products -->
  <rect x="130" y="165" width="260" height="35" class="step-box"/>
  <text x="150" y="187" class="text-num">3.</text>
  <text x="170" y="187" class="text-step">Import Product Catalog</text>

  <!-- Parallel paths -->
  <line x1="260" y1="200" x2="260" y2="215" stroke="#495057" stroke-width="2"/>
  <line x1="130" y1="215" x2="390" y2="215" stroke="#495057" stroke-width="2"/>
  <line x1="130" y1="215" x2="130" y2="235" class="arrow"/>
  <line x1="390" y1="215" x2="390" y2="235" class="arrow"/>

  <!-- Step 4a: Create Campaigns -->
  <rect x="40" y="240" width="180" height="50" class="branch-box"/>
  <text x="60" y="262" class="text-num">4a.</text>
  <text x="85" y="262" class="text-step">Create Sponsored</text>
  <text x="85" y="278" class="text-step">Campaigns</text>

  <!-- Step 4b: Manage Products -->
  <rect x="300" y="240" width="180" height="50" class="branch-box"/>
  <text x="320" y="262" class="text-num">4b.</text>
  <text x="345" y="262" class="text-step">Manage Products</text>
  <text x="345" y="278" class="text-step">(Update, Sync)</text>

  <!-- Merge paths -->
  <line x1="130" y1="290" x2="130" y2="305" stroke="#495057" stroke-width="2"/>
  <line x1="390" y1="290" x2="390" y2="305" stroke="#495057" stroke-width="2"/>
  <line x1="130" y1="305" x2="390" y2="305" stroke="#495057" stroke-width="2"/>
  <line x1="260" y1="305" x2="260" y2="325" class="arrow"/>

  <!-- Step 5: Monitor Analytics -->
  <rect x="100" y="330" width="320" height="35" class="result-box"/>
  <text x="120" y="352" class="text-num">5.</text>
  <text x="140" y="352" class="text-step">Monitor Analytics &amp; Insights</text>

  <line x1="260" y1="365" x2="260" y2="385" class="arrow"/>

  <!-- Step 6: Conversions -->
  <rect x="60" y="390" width="400" height="35" class="step-box"/>
  <text x="80" y="412" class="text-num">6.</text>
  <text x="100" y="412" class="text-step">Receive Conversion Webhooks → Pay Commissions</text>
</svg>
