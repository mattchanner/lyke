<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420">
  <defs>
    <style>
      .actor-box { stroke-width: 2; rx: 10; }
      .actor-retailer { fill: #e8eaf6; stroke: #3949ab; }
      .actor-network { fill: #fff3e0; stroke: #f57c00; }
      .actor-lyke { fill: #e3f2fd; stroke: #1976d2; }
      .actor-creator { fill: #e8f5e9; stroke: #388e3c; }
      .money-arrow { stroke: #2e7d32; stroke-width: 2.5; fill: none; marker-end: url(#money-arrow); }
      .info-arrow { stroke: #9e9e9e; stroke-width: 1.5; fill: none; marker-end: url(#info-arrow); stroke-dasharray: 6,3; }
      .label { font-family: system-ui, sans-serif; font-size: 11px; fill: #212529; }
      .label-bold { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #212529; }
      .label-money { font-family: system-ui, sans-serif; font-size: 10px; fill: #2e7d32; font-weight: 600; }
      .label-detail { font-family: system-ui, sans-serif; font-size: 9px; fill: #757575; }
      .title { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: #212529; }
      .subtitle { font-family: system-ui, sans-serif; font-size: 10px; fill: #757575; }
      .example-box { fill: #fafafa; stroke: #e0e0e0; stroke-width: 1; rx: 6; }
      .example-label { font-family: system-ui, sans-serif; font-size: 10px; fill: #424242; }
      .example-amount { font-family: system-ui, sans-serif; font-size: 11px; fill: #2e7d32; font-weight: 600; }
    </style>
    <marker id="money-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
    </marker>
    <marker id="info-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9e9e9e"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="24" text-anchor="middle" class="title">How Commission Flows from Sale to Creator</text>
  <text x="350" y="40" text-anchor="middle" class="subtitle">Example: Shopper buys a £75 dress via a creator's post</text>

  <!-- Shopper action (top) -->
  <rect x="235" y="55" width="230" height="30" rx="15" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="350" y="75" text-anchor="middle" class="label-bold">Shopper buys £75 item</text>

  <!-- Info arrow down -->
  <line x1="350" y1="85" x2="350" y2="105" class="info-arrow"/>

  <!-- Actor boxes row -->
  <!-- Retailer -->
  <rect x="30" y="110" width="130" height="60" class="actor-box actor-retailer"/>
  <text x="95" y="137" text-anchor="middle" class="label-bold">Retailer</text>
  <text x="95" y="155" text-anchor="middle" class="label-detail">Pays 8% commission</text>

  <!-- AWIN -->
  <rect x="220" y="110" width="130" height="60" class="actor-box actor-network"/>
  <text x="285" y="137" text-anchor="middle" class="label-bold">AWIN</text>
  <text x="285" y="155" text-anchor="middle" class="label-detail">Affiliate network</text>

  <!-- LYKE -->
  <rect x="410" y="110" width="130" height="60" class="actor-box actor-lyke"/>
  <text x="475" y="137" text-anchor="middle" class="label-bold">LYKE</text>
  <text x="475" y="155" text-anchor="middle" class="label-detail">Platform (publisher)</text>

  <!-- Creator -->
  <rect x="540" y="210" width="130" height="60" class="actor-box actor-creator"/>
  <text x="605" y="237" text-anchor="middle" class="label-bold">Creator</text>
  <text x="605" y="255" text-anchor="middle" class="label-detail">Content creator</text>

  <!-- Money arrows -->
  <!-- Retailer → AWIN: £6.00 -->
  <line x1="160" y1="140" x2="218" y2="140" class="money-arrow"/>
  <text x="189" y="133" text-anchor="middle" class="label-money">£6.00</text>

  <!-- AWIN → LYKE: £4.50 -->
  <line x1="350" y1="140" x2="408" y2="140" class="money-arrow"/>
  <text x="379" y="133" text-anchor="middle" class="label-money">£4.50</text>

  <!-- LYKE → Creator: £3.15 -->
  <path d="M 510 170 Q 560 190 570 208" class="money-arrow"/>
  <text x="555" y="190" text-anchor="middle" class="label-money">£3.15</text>

  <!-- Deduction labels -->
  <text x="285" y="185" text-anchor="middle" class="label-detail">AWIN retains £1.50 (25%)</text>
  <text x="475" y="185" text-anchor="middle" class="label-detail">LYKE retains £1.35 (30%)</text>

  <!-- Example breakdown box -->
  <rect x="30" y="230" width="460" height="175" class="example-box"/>
  <text x="50" y="255" class="label-bold">Commission Breakdown</text>

  <text x="50" y="280" class="example-label">Sale amount</text>
  <text x="400" y="280" text-anchor="end" class="example-amount">£75.00</text>

  <text x="50" y="300" class="example-label">Retailer pays 8% commission to AWIN</text>
  <text x="400" y="300" text-anchor="end" class="example-amount">£6.00</text>

  <line x1="50" y1="310" x2="420" y2="310" stroke="#e0e0e0" stroke-width="1"/>

  <text x="50" y="330" class="example-label">AWIN retains 25% network fee</text>
  <text x="400" y="330" text-anchor="end" class="label-detail">−£1.50</text>

  <text x="50" y="350" class="example-label">LYKE receives (publisher share)</text>
  <text x="400" y="350" text-anchor="end" class="example-amount">£4.50</text>

  <line x1="50" y1="360" x2="420" y2="360" stroke="#e0e0e0" stroke-width="1"/>

  <text x="50" y="380" class="example-label">Creator receives 70% of LYKE's share</text>
  <text x="400" y="380" text-anchor="end" class="example-amount">£3.15</text>

  <text x="50" y="396" class="example-label">LYKE retains 30% platform revenue</text>
  <text x="400" y="396" text-anchor="end" class="example-amount">£1.35</text>
</svg>
