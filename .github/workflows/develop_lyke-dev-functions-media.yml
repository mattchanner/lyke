# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy dotnet core project to Azure Function App - lyke-dev-functions-media

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'backend/src/Lyke.Functions'
  DOTNET_VERSION: '10.0.x'
  AZURE_FUNCTIONAPP_NAME: 'lyke-dev-functions-media'
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 'Publish Project'
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          dotnet publish --configuration Release --output ./output
          popd

      - name: 'Zip Publish Output'
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output'
          zip -r ../deploy.zip .
          popd

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FD5E3C0B456144F492CF7D1B0C71A3DA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_57724B38918F4CE5B83E1830F05FF164 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_83DDFA50938D46E0A97115D462325DC5 }}

      - name: 'Deploy to Azure Functions via CLI'
        shell: bash
        run: |
          az functionapp deployment source config-zip \
            --resource-group '${{ env.AZURE_RESOURCE_GROUP }}' \
            --name '${{ env.AZURE_FUNCTIONAPP_NAME }}' \
            --src '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/deploy.zip'
