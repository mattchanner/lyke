<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/settings"></ion-back-button>
    </ion-buttons>
    <ion-title>Delete Account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="warning-section">
    <ion-icon name="warning-outline" color="danger" class="warning-icon"></ion-icon>
    <h2>Delete Your Account</h2>
    <p>This action is <strong>permanent</strong> and cannot be undone.</p>
  </div>

  <h3>What will be deleted</h3>
  <ion-list lines="full">
    <ion-item>
      <ion-label>Your profile and body data</ion-label>
    </ion-item>
    <ion-item>
      <ion-label>All posts and media</ion-label>
    </ion-item>
    <ion-item>
      <ion-label>Saved content and history</ion-label>
    </ion-item>
    <ion-item>
      <ion-label>Connected services and preferences</ion-label>
    </ion-item>
  </ion-list>

  <div class="confirmation-section">
    <p>Type <strong>DELETE</strong> to confirm:</p>
    <ion-item>
      <ion-input
        placeholder="Type DELETE"
        [value]="confirmationText()"
        (ionInput)="confirmationText.set($event.detail.value || '')"
        [disabled]="isDeleting()"
      ></ion-input>
    </ion-item>

    <ion-button
      expand="block"
      color="danger"
      [disabled]="!isConfirmed() || isDeleting()"
      (click)="onDelete()"
    >
      @if (isDeleting()) {
        <ion-spinner name="crescent"></ion-spinner>
      } @else {
        Delete My Account
      }
    </ion-button>
  </div>
</ion-content>
