<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/feed"></ion-back-button>
    </ion-buttons>
    <ion-title>Register as Retailer</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="register-header">
    <h2>Set up your retailer account</h2>
    <p>Start showcasing your products to fashion-conscious shoppers.</p>
  </div>

  <ion-list>
    <ion-item>
      <ion-input
        label="Business Name"
        labelPlacement="stacked"
        placeholder="Enter your business name"
        [value]="name()"
        (ionInput)="name.set($event.detail.value ?? '')"
        required
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        label="Logo URL"
        labelPlacement="stacked"
        placeholder="https://example.com/logo.png"
        type="url"
        [value]="logoUrl()"
        (ionInput)="logoUrl.set($event.detail.value ?? '')"
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        label="Website"
        labelPlacement="stacked"
        placeholder="https://example.com"
        type="url"
        [value]="websiteUrl()"
        (ionInput)="websiteUrl.set($event.detail.value ?? '')"
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        label="Contact Email"
        labelPlacement="stacked"
        placeholder="contact@example.com"
        type="email"
        [value]="contactEmail()"
        (ionInput)="contactEmail.set($event.detail.value ?? '')"
      ></ion-input>
    </ion-item>
  </ion-list>

  <ion-button expand="block" class="ion-margin-top" (click)="submit()" [disabled]="isSaving() || !name().trim()">
    @if (isSaving()) {
      <ion-spinner name="crescent"></ion-spinner>
    } @else {
      Register
    }
  </ion-button>
</ion-content>
