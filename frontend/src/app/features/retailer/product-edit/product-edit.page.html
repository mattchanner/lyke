<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/retailer/products"></ion-back-button>
    </ion-buttons>
    <ion-title>Edit Product</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (product(); as p) {
    <ion-list>
      <ion-item>
        <ion-input
          label="Name"
          labelPlacement="stacked"
          [value]="name()"
          (ionInput)="name.set($event.detail.value ?? '')"
        ></ion-input>
      </ion-item>
      <ion-item>
        <ion-textarea
          label="Description"
          labelPlacement="stacked"
          [value]="description()"
          (ionInput)="description.set($event.detail.value ?? '')"
          [autoGrow]="true"
        ></ion-textarea>
      </ion-item>
      <ion-item>
        <ion-input
          label="Category"
          labelPlacement="stacked"
          [value]="category()"
          (ionInput)="category.set($event.detail.value ?? '')"
        ></ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          label="Sub-category"
          labelPlacement="stacked"
          [value]="subCategory()"
          (ionInput)="subCategory.set($event.detail.value ?? '')"
        ></ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          label="Product URL"
          labelPlacement="stacked"
          type="url"
          [value]="productUrl()"
          (ionInput)="productUrl.set($event.detail.value ?? '')"
        ></ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          label="Price"
          labelPlacement="stacked"
          type="number"
          [value]="price()"
          (ionInput)="price.set($event.detail.value ?? '')"
        ></ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          label="Currency (ISO)"
          labelPlacement="stacked"
          [value]="currency()"
          (ionInput)="currency.set($event.detail.value ?? '')"
          maxlength="3"
        ></ion-input>
      </ion-item>
      <ion-item>
        <ion-toggle
          [checked]="isActive()"
          (ionChange)="isActive.set($event.detail.checked)"
        >Active</ion-toggle>
      </ion-item>
    </ion-list>

    <ion-button expand="block" class="ion-margin-top" (click)="save()" [disabled]="isSaving()">
      @if (isSaving()) {
        <ion-spinner name="crescent"></ion-spinner>
      } @else {
        <ion-icon name="save-outline" slot="start"></ion-icon>
        Save Changes
      }
    </ion-button>
  }
</ion-content>
