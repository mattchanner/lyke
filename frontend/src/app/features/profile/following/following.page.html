<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/profile"></ion-back-button>
    </ion-buttons>
    <ion-title>Following</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (isLoading()) {
    <div class="loading-container">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  } @else if (users().length === 0) {
    <div class="empty-state">
      <h3>Not following anyone</h3>
      <p>People you follow will appear here.</p>
    </div>
  } @else {
    <ion-list>
      @for (user of users(); track user.userId) {
        <ion-item [routerLink]="['/profile/user', user.userId]" detail>
          <ion-avatar slot="start">
            <img [src]="user.profileImageUrl || 'assets/default-avatar.svg'" [alt]="user.displayName" />
          </ion-avatar>
          <ion-label>
            <h2>
              {{ user.displayName }}
              @if (user.isVerified) {
                <ion-icon name="checkmark-circle" color="primary"></ion-icon>
              }
            </h2>
          </ion-label>
          <ion-button fill="outline" size="small" slot="end" (click)="unfollow(user.userId); $event.stopPropagation()">
            Unfollow
          </ion-button>
        </ion-item>
      }
    </ion-list>
  }
</ion-content>
