<ion-header>
  <ion-toolbar>
    <ion-title>Style Quiz</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="landing-container">
    <div class="hero-section">
      <h1>Discover Your Style Type</h1>
      <p class="subtitle">Answer 14 questions about your natural body lines to find your Kibbe style family.</p>
    </div>

    <div class="families-preview">
      <span class="family-chip">Dramatic</span>
      <span class="family-chip">Natural</span>
      <span class="family-chip">Classic</span>
      <span class="family-chip">Gamine</span>
      <span class="family-chip">Romantic</span>
    </div>

    <div class="quiz-info">
      <p>✓ Takes about 5 minutes</p>
      <p>✓ No account required to start</p>
      <p>✓ Results saved to your profile after sign-up</p>
    </div>

    <ion-button expand="block" (click)="start()">
      Start Quiz
    </ion-button>
  </div>
</ion-content>
