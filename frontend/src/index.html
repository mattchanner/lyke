<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>LYKE</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Inter — clean, modern, highly readable -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <style>
    .lyke-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F4F2EE;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      gap: 2rem;
      z-index: 9999;
    }

    .lyke-splash-icon {
      width: 80px;
      height: 80px;
      animation: splashFadeUp 0.6s ease-out both;
    }

    .lyke-splash-wordmark {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: #2A2D32;
      animation: splashFadeUp 0.6s 0.15s ease-out both;
    }

    .lyke-splash-loader {
      width: 48px;
      height: 3px;
      border-radius: 2px;
      background: #E3E0DA;
      overflow: hidden;
      animation: splashFadeUp 0.6s 0.3s ease-out both;
    }

    .lyke-splash-loader::after {
      content: '';
      display: block;
      width: 50%;
      height: 100%;
      border-radius: 2px;
      background: #0E3A3B;
      animation: splashSlide 1.2s 0.5s ease-in-out infinite;
    }

    @keyframes splashFadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes splashSlide {
      0%   { transform: translateX(-10%); }
      50%  { transform: translateX(120%); }
      100% { transform: translateX(-10%); }
    }

    @media (prefers-color-scheme: dark) {
      .lyke-splash { background: #121214; }
      .lyke-splash-wordmark { color: #E3E0DA; }
      .lyke-splash-loader { background: #2a2a2e; }
      .lyke-splash-loader::after { background: #3A8B8D; }
      .lyke-splash-icon .icon-bg { fill: #1e1e22; }
      .lyke-splash-icon .icon-hook { stroke: #337A7C; }
      .lyke-splash-icon .icon-hook-dot { fill: #337A7C; }
      .lyke-splash-icon .icon-heart { fill: #3A8B8D; }
      .lyke-splash-icon .icon-highlight { fill: #4E9698; }
    }
  </style>
</head>

<body>
  <app-root>
    <div class="lyke-splash">
      <svg class="lyke-splash-icon" viewBox="20 18 68 68" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect class="icon-bg" x="20" y="18" width="68" height="68" rx="14" fill="#F4F2EE"/>
        <path class="icon-hook" d="M46,36 Q46,28 54,28 Q62,28 62,36" stroke="#0C3334" stroke-width="3" stroke-linecap="round"/>
        <circle class="icon-hook-dot" cx="54" cy="25" r="3" fill="#0C3334"/>
        <path class="icon-heart" d="M54,78 C54,78 30,62 30,46 C30,38 36,33 43,33 C48,33 52,36 54,40 C56,36 60,33 65,33 C72,33 78,38 78,46 C78,62 54,78 54,78 Z" fill="#0E3A3B"/>
        <path class="icon-highlight" d="M43,36 C39,36 34,40 34,46 C34,50 38,56 43,60 C40,54 37,48 37,44 C37,40 39,37 43,36 Z" fill="#264E4F"/>
      </svg>
      <div class="lyke-splash-wordmark">LYKE</div>
      <div class="lyke-splash-loader"></div>
    </div>
  </app-root>
</body>

</html>
